<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Todo List</title>
<style>
  :root { --bg: #f4f4f5; --card: #fff; --text: #18181b; --muted: #71717a; --accent: #2563eb; --line: #e4e4e7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181b; --card: #27272a; --text: #f4f4f5; --muted: #a1a1aa; --accent: #60a5fa; --line: #3f3f46; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; display: flex; justify-content: center; padding: 48px 16px; }
  main { width: 100%; max-width: 440px; background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 4px 16px rgb(0 0 0 / .08); align-self: flex-start; }
  h1 { margin: 0 0 16px; font-size: 1.5rem; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
  button { border: 0; border-radius: 8px; cursor: pointer; font: inherit; }
  form button { padding: 10px 16px; background: var(--accent); color: #fff; }
  ul { list-style: none; margin: 16px 0 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  li span { flex: 1; word-break: break-word; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  li button { background: none; color: var(--muted); font-size: 1.2rem; padding: 0 6px; }
  li button:hover { color: #dc2626; }
  p { margin: 16px 0 0; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Todo List</h1>
  <form id="form">
    <input id="input" type="text" placeholder="What needs doing?" aria-label="New task" autocomplete="off" required>
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <p id="count"></p>
</main>
<script>
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const list = document.getElementById('list');
  const count = document.getElementById('count');

  let todos = [];
  try { todos = JSON.parse(localStorage.getItem('todos')) || []; } catch {}

  function save() {
    try { localStorage.setItem('todos', JSON.stringify(todos)); } catch {}
  }

  function render() {
    list.innerHTML = '';
    todos.forEach((todo, i) => {
      const li = document.createElement('li');
      li.className = todo.done ? 'done' : '';

      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = todo.done;
      box.setAttribute('aria-label', 'Mark done');
      box.onchange = () => { todo.done = box.checked; save(); render(); };

      const text = document.createElement('span');
      text.textContent = todo.text;

      const del = document.createElement('button');
      del.textContent = '×';
      del.setAttribute('aria-label', 'Delete task');
      del.onclick = () => { todos.splice(i, 1); save(); render(); };

      li.append(box, text, del);
      list.append(li);
    });
    const left = todos.filter(t => !t.done).length;
    count.textContent = todos.length ? `${left} task${left === 1 ? '' : 's'} left` : 'Nothing to do yet.';
  }

  form.onsubmit = e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({ text, done: false });
    input.value = '';
    save();
    render();
  };

  render();
</script>
</body>
</html>
